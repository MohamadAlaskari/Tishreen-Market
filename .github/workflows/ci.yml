name: CI

# P1-T8 (docs/12): Web lint/typecheck/test/build + API mvnw verify (Testcontainers).
# Grüne Checks sind Voraussetzung der Definition of Done (docs/13 §1).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web · lint / typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Liest die pnpm-Version aus dem packageManager-Feld der package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=web

      - name: Typecheck
        run: pnpm turbo run typecheck --filter=web

      - name: Test
        run: pnpm turbo run test --filter=web

      - name: Build
        run: pnpm turbo run build --filter=web

      - name: Upload web build
        uses: actions/upload-artifact@v5
        with:
          name: web-build
          path: apps/web/dist
          retention-days: 7

  api:
    name: API · mvnw verify (Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: ./mvnw -B -ntp verify

      - name: Upload API jar
        uses: actions/upload-artifact@v5
        with:
          name: api-jar
          path: api/target/*.jar
          retention-days: 7
