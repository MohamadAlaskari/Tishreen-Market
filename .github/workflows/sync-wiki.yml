name: Sync Wiki

# Spiegelt die kanonischen Docs & Regeln ins GitHub-Wiki,
# sobald sich auf main etwas an ihnen ändert.
on:
  push:
    branches: [main]
    paths:
      - "tishreen-handoff/tishreen-handoff/docs/**"
      - "tishreen-handoff/tishreen-handoff/CLAUDE.md"
      - "tishreen-handoff/tishreen-handoff/README.md"
      - "tishreen-handoff/tishreen-handoff/.cursor/rules/**"
      - "scripts/sync-wiki.sh"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wiki klonen
        run: git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki

      - name: Seiten generieren
        run: bash scripts/sync-wiki.sh wiki

      - name: Committen & pushen
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki bereits aktuell."
          else
            git commit -m "docs: sync wiki from ${{ github.sha }}"
            git push
          fi
