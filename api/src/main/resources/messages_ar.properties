# Arabic error messages — keys are the stable error codes from docs/06 §Errors.
INTERNAL_ERROR=حدث خطأ غير متوقع. حاول مرة أخرى لاحقًا.
VALIDATION_FAILED=الطلب يحتوي على حقول غير صالحة.
NOT_FOUND=المورد المطلوب غير موجود.
METHOD_NOT_ALLOWED=طريقة الطلب غير مدعومة لهذا المسار.
REQUEST_FAILED=تعذر تنفيذ الطلب.
STORE_CLOSED=المتجر مغلق حاليًا.
