spring:
  application:
    name: tishreen-api
  web:
    # Accept-Language resolution; Arabic is the default and fallback language (docs/06, docs/10).
    locale: ar
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    # Env-first (docs/09 §Configuration); the fallbacks mirror infra/docker-compose.yml so a
    # fresh clone runs against the dev-only compose database without any setup.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tishreen}
    username: ${DB_USER:tishreen}
    password: ${DB_PASSWORD:tishreen}
  flyway:
    # Reference schema + core seed only. The dev profile adds classpath:db/dev (V900 sample
    # data) — prod must never see it (docs/04 Part B).
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

# JSON log files land here; /it/logs reads them later (docs/09 §Configuration).
app:
  logs:
    dir: ${LOGS_DIR:logs}

# springdoc is opt-in: only the dev profile (and later IT) exposes it (docs/09).
# The OpenAPI document is served at /api/v1/docs (docs/06 — route name is contractual).
springdoc:
  api-docs:
    enabled: false
    path: /api/v1/docs
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod

server:
  port: ${PORT:8080}
