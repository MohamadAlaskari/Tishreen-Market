# English error messages — keys are the stable error codes from docs/06 §Errors.
INTERNAL_ERROR=An unexpected error occurred. Please try again later.
VALIDATION_FAILED=The request contains invalid fields.
NOT_FOUND=The requested resource was not found.
METHOD_NOT_ALLOWED=The request method is not supported for this route.
REQUEST_FAILED=The request could not be processed.
STORE_CLOSED=The store is currently closed.
