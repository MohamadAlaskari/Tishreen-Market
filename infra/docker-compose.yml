# Local dev infrastructure (docs/09 §4). Copy .env.example to .env to override
# ports/credentials; the defaults below only exist so a fresh clone starts (dev-only DB).
services:
  postgres:
    image: postgres:15
    container_name: tishreen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tishreen}
      POSTGRES_USER: ${POSTGRES_USER:-tishreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tishreen}
    ports:
      # Loopback only: a dev DB with well-known credentials must not listen on the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives container restarts and recreation.
      - tishreen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tishreen} -d ${POSTGRES_DB:-tishreen}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tishreen-pgdata:
