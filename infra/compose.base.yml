# Base Postgres service for the three operating modes of tishreen.ps1
# (docs/09 §4). Never started alone: every call names this base file PLUS one
# of compose.dev.yml / compose.nearprod.yml / compose.prod.yml, which set the
# compose project name and the host port. The three projects have their own
# volumes and ports and share NO database.
# Copy .env.example to .env to override ports/credentials; the defaults below
# only exist so a fresh clone starts (dev-only DB).
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tishreen}
      POSTGRES_USER: ${POSTGRES_USER:-tishreen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tishreen}
    volumes:
      # Named volume, prefixed with the project name (tishreen-dev_...,
      # tishreen-nearprod_..., tishreen-prod_...): every mode keeps its own
      # data, and it survives container restarts and recreation.
      - tishreen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tishreen} -d ${POSTGRES_DB:-tishreen}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tishreen-pgdata:
